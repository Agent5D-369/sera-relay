name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.13.0'
      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = Windows ]; then
            python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install torch==2.9.1
          fi
          python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Install receiver dependencies
        working-directory: receiver
        run: npm ci --ignore-scripts
      - name: Run receiver tests
        working-directory: receiver
        run: node --test *.test.cjs
      - name: Review and retry browser regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          node receiver/verify_inline.cjs
          node receiver/verify_retry.cjs
          node receiver/verify_ux.cjs
