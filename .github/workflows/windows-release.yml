name: Windows beta release

on:
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    name: Build, test, and draft Windows beta
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CI: 'true'
      RELEASE_TAG: v2.1.0-beta.1
      ZIP_NAME: SeraRelay-2.1.0-beta.1-Windows-x64.zip
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.13.0'
      - name: Install FFmpeg for build and tests
        shell: pwsh
        run: choco upgrade ffmpeg --yes --no-progress
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-build.txt
      - name: Install receiver dependencies
        working-directory: receiver
        run: npm ci --ignore-scripts
      - name: Fetch and validate bundled Whisper model
        shell: pwsh
        run: python -c "import whisper; model = whisper.load_model('small'); assert model is not None"
      - name: Run Python tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Run receiver tests
        working-directory: receiver
        run: node --test *.test.cjs
      - name: Refuse an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists; update RELEASE_TAG before creating another release." }
          $LASTEXITCODE = 0
          git fetch --tags --force
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -eq 0) { throw "Tag $env:RELEASE_TAG already exists; update RELEASE_TAG before creating another release." }
          $LASTEXITCODE = 0
      - name: Build Windows package
        shell: pwsh
        run: |
          $pythonPath = (Get-Command python).Source
          .\Build-Release.ps1 -PythonPath $pythonPath
      - name: Create checksums and build provenance
        shell: pwsh
        run: |
          $zip = Join-Path $PWD "dist\$env:ZIP_NAME"
          if (-not (Test-Path -LiteralPath $zip)) { throw "Build did not produce $env:ZIP_NAME" }
          $nodePath = Join-Path $PWD 'dist\SeraRelay\_internal\runtime\node.exe'
          $nodeVersion = (& $nodePath --version).Trim()
          $ffmpegVersion = (& ffmpeg -version | Select-Object -First 1).Trim()
          $whisperVersion = python -c "from importlib.metadata import version; print(version('openai-whisper'))"
          $torchVersion = python -c "from importlib.metadata import version; print(version('torch'))"
          $buildInfo = [ordered]@{
            product = 'Sera Relay'
            version = '2.1.0-beta.1'
            repository = $env:GITHUB_REPOSITORY
            git_sha = (git rev-parse HEAD).Trim()
            python = (python --version 2>&1).Trim()
            node = $nodeVersion
            ffmpeg = $ffmpegVersion
            whisper = $whisperVersion.Trim()
            torch = $torchVersion.Trim()
            windows_runner = $env:ImageOS
            unsigned = $true
            built_at_utc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $infoPath = Join-Path $PWD 'dist\BUILD-INFO.json'
          $buildInfo | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $infoPath -Encoding utf8
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:ZIP_NAME" | Set-Content -LiteralPath (Join-Path $PWD 'dist\SHA256SUMS.txt') -Encoding ascii
      - name: Create draft prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG `
            "dist\$env:ZIP_NAME" `
            'dist\SHA256SUMS.txt' `
            'dist\BUILD-INFO.json' `
            --repo $env:GITHUB_REPOSITORY `
            --target (git rev-parse HEAD) `
            --draft `
            --prerelease `
            --title 'Sera Relay 2.1.0-beta.1 for Windows' `
            --notes 'Unsigned Windows x64 beta. Install FFmpeg separately; FFmpeg is not bundled. Review the attached SHA256SUMS.txt and BUILD-INFO.json before publishing this draft.'
